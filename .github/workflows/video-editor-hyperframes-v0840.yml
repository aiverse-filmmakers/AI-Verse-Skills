name: Video Editor HyperFrames 0.8.40 Acceptance

on:
  push:
    branches:
      - test/video-editor-hyperframes-v0840-acceptance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nate-hyperframes-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout System harness
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install image assertion dependency
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Run isolated Nate and HyperFrames acceptance
        run: bash tests/video-editor/hyperframes-v0840-acceptance.sh

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-v0840-acceptance
          path: ${{ runner.temp }}/aiverse-video-editor-hf-acceptance/artifacts
          if-no-files-found: warn
          retention-days: 14
