name: Full E2E Install

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "registry/**"
      - "skills/**"
      - "scripts/**"
      - ".github/workflows/e2e-install.yml"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  full-install-aiverse-os:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout AI-Verse-Skills
        uses: actions/checkout@v4

      - name: Checkout AI-Verse OS
        uses: actions/checkout@v4
        with:
          repository: aiverse-filmmakers/AI-Verse-OS
          path: _e2e/AI-Verse-OS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate registries
        run: python scripts/validate_registry.py

      - name: Full pinned upstream install
        run: |
          python installer/aiverse_skills.py \
            --root "$RUNNER_TEMP/aiverse-skills" \
            --cache "$RUNNER_TEMP/aiverse-cache" \
            install --profile full --aiverse-os "$GITHUB_WORKSPACE/_e2e/AI-Verse-OS"

      - name: Integrity and OS integration doctor
        run: |
          python installer/aiverse_skills.py \
            --root "$RUNNER_TEMP/aiverse-skills" \
            doctor --aiverse-os "$GITHUB_WORKSPACE/_e2e/AI-Verse-OS" --readiness

      - name: E2E capability count
        run: |
          python installer/aiverse_skills.py \
            --root "$RUNNER_TEMP/aiverse-skills" \
            e2e --aiverse-os "$GITHUB_WORKSPACE/_e2e/AI-Verse-OS"

      - name: Exercise transactional update
        run: |
          python installer/aiverse_skills.py \
            --root "$RUNNER_TEMP/aiverse-skills" \
            --cache "$RUNNER_TEMP/aiverse-cache" \
            update --aiverse-os "$GITHUB_WORKSPACE/_e2e/AI-Verse-OS"
          python installer/aiverse_skills.py \
            --root "$RUNNER_TEMP/aiverse-skills" \
            doctor --aiverse-os "$GITHUB_WORKSPACE/_e2e/AI-Verse-OS"

      - name: Exercise rollback
        run: |
          python installer/aiverse_skills.py \
            --root "$RUNNER_TEMP/aiverse-skills" \
            rollback --aiverse-os "$GITHUB_WORKSPACE/_e2e/AI-Verse-OS"
          python installer/aiverse_skills.py \
            --root "$RUNNER_TEMP/aiverse-skills" \
            e2e --aiverse-os "$GITHUB_WORKSPACE/_e2e/AI-Verse-OS"
