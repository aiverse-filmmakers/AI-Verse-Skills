name: WSA-2026-018 Generation Lease Retention

on:
  pull_request:
    paths:
      - "installer/generation_lifecycle.py"
      - "installer/public_beta.py"
      - "installer/controller_containment.py"
      - "installer/aiverse_skills_v3.py"
      - "tests/test_generation_lifecycle.py"
      - ".github/workflows/wsa-2026-018-generation-leases.yml"
  push:
    branches: [main]
    paths:
      - "installer/generation_lifecycle.py"
      - "installer/public_beta.py"
      - "installer/controller_containment.py"
      - "installer/aiverse_skills_v3.py"
      - "tests/test_generation_lifecycle.py"
      - ".github/workflows/wsa-2026-018-generation-leases.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generation-lease-retention:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile lifecycle and containment modules
        run: |
          python -m py_compile installer/generation_lifecycle.py
          python -m py_compile installer/public_beta.py
          python -m py_compile installer/controller_containment.py
          python -m py_compile installer/aiverse_skills_v3.py
      - name: Run WSA-018 lease and lifecycle regressions
        run: python -m unittest tests.test_generation_lifecycle -v
