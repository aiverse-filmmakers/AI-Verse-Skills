name: Validate AI-Verse Skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_registry.py
      - run: python -m unittest discover -s tests -v
      - run: python installer/aiverse_skills.py list >/dev/null
      - run: python installer/aiverse_skills.py install --profile full --dry-run >/dev/null
